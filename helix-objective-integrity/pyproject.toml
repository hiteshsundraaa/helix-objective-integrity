[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-objective-integrity"
version = "0.1.0"
description = "Contract-bound temporal objective-integrity benchmark and runtime gate for long-horizon language agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Hitesh Sundra"}]
keywords = ["agent safety", "objective drift", "long-horizon agents", "runtime gate", "tool-use safety", "benchmark"]
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
helix = "helix.cli:main"

[tool.setuptools.packages.find]
include = ["helix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
